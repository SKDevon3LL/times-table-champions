<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kirkwood Family Times Table Champions App</title>
<meta name="description" content="Hughie and Jessica's times tables: practice, tests with prizes, Beat the Clock and daily challenges. Works offline.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Times Tables">
<meta name="theme-color" content="#F4F8FD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a squared maths exercise book (chalkboard at night) with chunky sticker cards; one column on phones. */
:root{
  --paper:#F4F8FD; --grid:#DAE6F4; --ink:#1B2140; --muted:#56608A; --line:#1B2140;
  --card:#FFFFFF; --card2:#EAF1FA; --shadow:#1B2140; --on-accent:#1B2140;
  --tomato:#FF7A5C; --sky:#5AA2FF; --mint:#2FD3A7; --grape:#A98BFF; --sun:#FFC93D; --pink:#FF8CC6;
  --good:#12936F; --bad:#D9412F;
  --bronze:#D08A4E; --silver:#B4BECC; --gold:#F5BC12; --diamond:#55D6EA;
  --me:var(--sky);
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --radius:20px;
  --bgimg:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  --bgsize:28px 28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1C2A27; --grid:#263733; --ink:#F1EEE2; --muted:#A8B7AF; --line:#D5DDD3;
  --card:#24352F; --card2:#2C4039; --shadow:#0B1412; --on-accent:#1B2140;
  --good:#45DDB4; --bad:#FF8A78; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1C2A27; --grid:#263733; --ink:#F1EEE2; --muted:#A8B7AF; --line:#D5DDD3;
  --card:#24352F; --card2:#2C4039; --shadow:#0B1412; --on-accent:#1B2140;
  --good:#45DDB4; --bad:#FF8A78; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:var(--bgimg); background-size:var(--bgsize); min-height:100vh;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:28px} h3{font-size:22px}
p{margin:0}
.mega{font-size:clamp(40px,7vw,72px)}
.mega.sm{font-size:clamp(32px,5vw,48px)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.num,.hist td,.stat b{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sync{font-size:12px;font-weight:800;color:var(--muted)}
.pad{-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.sticker{background:var(--card);border:2.5px solid var(--line);border-radius:var(--radius);box-shadow:5px 5px 0 var(--shadow);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--me);color:var(--on-accent);border:2.5px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);padding:10px 18px;font-weight:900;font-size:16px;transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.big{font-size:19px;padding:14px 24px}
.btn.small{font-size:14px;padding:6px 12px;border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;padding:0;font-weight:800;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:16px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px}
.brand svg{width:40px;height:40px;flex:none}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me-chip{display:inline-flex;align-items:center;gap:8px;font-weight:900}
.icon-btn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.tabs{overflow-x:auto;margin-bottom:22px;padding-bottom:4px}
.tabs-in{display:flex;gap:6px;width:max-content}
.tab{background:transparent;border:2px solid transparent;border-radius:999px;padding:7px 15px;font-weight:900;white-space:nowrap}
.tab:hover{border-color:var(--line)}
.tab.on{background:var(--ink);color:var(--paper)}

.avatar{--s:48px;width:var(--s);height:var(--s);flex:none;display:inline-grid;place-items:center;background:var(--c);color:var(--on-accent);border:2.5px solid var(--line);border-radius:44% 56% 52% 48%/52% 44% 56% 48%;font-family:var(--display);font-size:calc(var(--s)*.52);line-height:1;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* login */
.login{display:grid;gap:28px;padding-top:12px}
.lede{font-size:19px;color:var(--muted);margin-top:10px}
.who{display:flex;gap:18px;flex-wrap:wrap}
.who-card{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:170px;flex:1 1 170px;max-width:260px;background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--shadow);padding:24px 16px;transition:transform .12s}
.who-card:hover{transform:rotate(-1.5deg) translateY(-3px)}
.who-card.on{background:color-mix(in srgb,var(--c) 28%,var(--card));transform:rotate(-1.5deg)}
.who-name{font-family:var(--display);font-size:30px;line-height:1}
.who-sub{color:var(--muted);font-weight:800;font-size:14px}
.form{display:grid;gap:8px;max-width:460px}
.form label{font-weight:900;font-size:14px;margin-top:6px}
.form input,.form select,.form textarea{width:100%;font:inherit;font-size:18px;font-weight:700;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.form .btn{margin-top:10px}
.err{color:var(--bad);font-weight:900}
.ok-msg{color:var(--good);font-weight:900}
.foot-link{font-size:15px}

/* home */
.hero-home{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.hello{min-width:0;flex:1 1 320px}
.xpbar{height:16px;border:2.5px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden;margin:14px 0 6px;max-width:460px}
.xpbar span{display:block;height:100%;background:var(--me);border-right:2.5px solid var(--line)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:10px 16px;min-width:108px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1}
.stat span{font-size:13px;font-weight:800;color:var(--muted)}
.grid-home{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:start}
.col{display:flex;flex-direction:column;gap:26px;min-width:0}
.today{display:grid;gap:14px;background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.today > div:first-child{display:grid;gap:6px}
.today .eyebrow{color:var(--ink);opacity:.75}
.today.game-ready{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.today.game-ready > div{flex:1 1 260px;min-width:0}
.rc-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.rc-tile{border:2.5px solid var(--line);border-radius:14px;background:var(--card);padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;cursor:pointer;color:var(--ink);font:inherit}
.rc-tile b{font-family:var(--display);font-size:24px}.rc-tile small{font-size:12px;opacity:.75}.rc-tile.sug{box-shadow:4px 4px 0 var(--shadow);background:color-mix(in srgb,var(--sun) 70%,var(--card))}
.rc-tile.full{background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.rc-tile .rc-dots{display:flex;gap:4px}.rc-tile .rc-dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--card)}.rc-tile .rc-dots i.on{background:var(--mint)}
.rc-rules{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}.rc-rules li{border:2px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--card);font-size:14px}
.rc-lines{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.rc-lines li{font-family:var(--display);font-size:22px;padding:6px 14px;border:2.5px solid var(--line);border-radius:12px;background:var(--card);opacity:.55}
.rc-lines li.done{background:color-mix(in srgb,var(--mint) 60%,var(--card));opacity:1}
.rc-lines li.now{font-size:34px;opacity:1;background:color-mix(in srgb,var(--sun) 70%,var(--card));box-shadow:4px 4px 0 var(--shadow)}
.jg-over{overflow-y:auto}
.stg-win{display:flex;justify-content:center}.stg-win img{display:block;width:min(100%,320px);max-height:52vh;object-fit:cover;object-position:50% 30%;border:3px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow)}
.rc-clock{font-family:var(--display);font-size:22px;font-weight:900}
.rc-mic{font-weight:800;margin:10px 0 0}.rc-mic.off{opacity:.8}
@media (max-width:420px){.rc-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.rc-lines li{font-size:18px}.rc-lines li.now{font-size:26px}}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.todo li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--card)}
.todo li.now{box-shadow:4px 4px 0 var(--shadow);background:color-mix(in srgb,var(--sun) 70%,var(--card))}
.todo li.done{background:color-mix(in srgb,var(--mint) 40%,var(--card))}
.todo li.locked{opacity:.6;border-style:dashed}
.todo li.sep{display:block;padding:6px 0 0;border:0;background:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:var(--ink);opacity:.75}
.todo .n{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--sun);color:var(--ink)}
.todo li.done .n{background:var(--mint)}
.todo li.locked .n{background:var(--card)}
.todo b{display:block;font-size:19px;line-height:1.15}
.todo small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.3}
.howvid{display:grid;gap:12px;justify-items:start;justify-self:start;width:100%;max-width:540px;margin:0}.howvid h2{margin:0 0 4px;font-size:22px}
.vid-over{position:fixed;inset:0;z-index:60;background:rgba(10,12,24,.82);display:grid;place-items:center;padding:16px}.vid-box{width:min(960px,100%);display:grid;gap:10px}.vid-box video{width:100%;border-radius:14px;background:#000}.vid-x{justify-self:end;background:var(--card)}.vid-msg{color:#fff;font-weight:800;text-align:center}
.who-card.not-mine{opacity:.5;cursor:not-allowed;box-shadow:none}
.extra-h{margin:10px 0 -4px;display:grid;gap:4px}.extra-h h2{font-size:24px;margin:0}.extra-h p{margin:0;font-weight:700;color:var(--muted);font-size:15px;line-height:1.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode{display:grid;gap:4px;text-align:left;background:color-mix(in srgb,var(--c) 26%,var(--card));border:2.5px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:16px;transition:transform .12s}
.mode:hover{transform:translateY(-3px) rotate(.6deg)}
.mode .glyph{font-family:var(--display);font-size:20px;line-height:1;color:var(--ink);opacity:.7}
.mode b{font-size:24px;font-weight:900;line-height:1.1}
.mode span{font-size:14px;color:var(--muted);font-weight:700}
.recs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:14px}
.recs li{display:grid;gap:8px;padding-top:14px;border-top:2px dashed var(--grid)}
.recs li:first-child{border-top:0;padding-top:0}
.recs .btn{justify-self:start}
.shelf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.prize{display:grid;justify-items:center;text-align:center;gap:2px}
.prize b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1}
.prize span{font-size:12px;font-weight:900;line-height:1.2}
.prize small{font-size:12px;color:var(--muted);font-weight:800}
.prize em{font-size:12px;font-style:normal;font-weight:800;color:var(--good);line-height:1.25}
.prize.locked svg{opacity:.28;filter:grayscale(1)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:900;font-size:13px;background:color-mix(in srgb,var(--mint) 35%,var(--card))}
.goals{list-style:none;padding:0;margin:12px 0 10px;display:grid;gap:12px}
.goal-top{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:15px}
.bar{height:12px;border:2px solid var(--line);border-radius:999px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--me)}
.goals li.done .bar span{background:var(--mint)}
.goals li.done .goal-top span::before{content:"\2713  ";color:var(--good);font-weight:900}

/* heatmap */
.heat-wrap{overflow-x:auto;min-width:0}
.heat{display:grid;grid-template-columns:repeat(13,minmax(22px,1fr));gap:3px;min-width:300px}
.heat > *{aspect-ratio:1;display:grid;place-items:center;font-size:11px;font-weight:800;border-radius:6px;font-variant-numeric:tabular-nums}
.heat .h{font-family:var(--display);font-weight:400;font-size:13px;color:var(--muted)}
.lv0{background:var(--card2);color:var(--muted)}
.lv1{background:color-mix(in srgb,var(--tomato) 45%,var(--card))}
.lv2{background:color-mix(in srgb,var(--sun) 60%,var(--card))}
.lv3{background:color-mix(in srgb,var(--mint) 50%,var(--card))}
.lv4{background:var(--mint);color:var(--on-accent)}
.heat.compact > *{font-size:0;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:800;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--grid)}

/* setup */
.setup{display:grid;gap:22px;max-width:760px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{min-width:58px;padding:10px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--display);font-size:22px;line-height:1}
.tchip.strong:not(.on){background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.tsplit{display:grid;gap:10px;margin:4px 0 14px}.tsplit b{font-size:15px}.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tc{border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:900;font-size:15px;background:color-mix(in srgb,var(--sun) 45%,var(--card))}.tc small{font-weight:700;opacity:.75}
.tc.strong{background:color-mix(in srgb,var(--mint) 55%,var(--card))}
.tchip .up{display:block;font-family:var(--body,inherit);font-size:11px;font-weight:900;margin-top:3px;opacity:.85}
.tchip.on{background:var(--me);color:var(--on-accent);box-shadow:3px 3px 0 var(--shadow);transform:translate(-1px,-1px)}
.toggle{display:flex;align-items:center;gap:12px;font-weight:800;background:none;border:0;padding:4px 0;text-align:left}
.toggle .sw{width:46px;height:26px;border:2.5px solid var(--line);border-radius:999px;position:relative;background:var(--card2);flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle[aria-pressed="true"] .sw{background:var(--me)}
.toggle[aria-pressed="true"] .sw::after{left:21px}

/* play */
.play{display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:start}
.play-main{display:grid;gap:14px;min-width:0}
.play-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.play-top .info{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-weight:900}
.pdots{display:flex;gap:5px;flex-wrap:wrap}
.pbar-wrap{display:flex;align-items:center;gap:12px}.pbar{flex:1;height:16px;border:2.5px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}.pbar span{display:block;height:100%;background:var(--me);border-radius:999px;transition:width .25s}.pbar-wrap b{white-space:nowrap;font-size:16px}
.pdots i{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);background:var(--card)}
.pdots i.y{background:var(--mint)} .pdots i.n{background:var(--tomato)} .pdots i.cur{background:var(--me);transform:scale(1.15)}
.qcard{text-align:center;padding:44px 16px 30px;transition:background .2s}
.q{font-family:var(--display);font-size:clamp(52px,11vw,110px);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.slot{display:inline-block;min-width:1.5em;border-bottom:8px solid var(--me);padding:0 .1em}
.fb{min-height:34px;margin-top:20px;font-size:22px;font-weight:900}
.is-ok .qcard{background:color-mix(in srgb,var(--mint) 35%,var(--card))}
.is-ok .fb{color:var(--good)}
.is-bad .qcard{background:color-mix(in srgb,var(--tomato) 28%,var(--card));animation:shake .35s}
.is-bad .fb{color:var(--bad)}
.hint{margin:14px auto 0;max-width:46ch;font-weight:800;font-size:17px;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:10px 14px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:74px;font-family:var(--display);font-size:34px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);transition:transform .06s}
.pad button:active{transform:translate(3px,3px);box-shadow:none}
.pad .ok{background:var(--mint);color:var(--on-accent)}
.pad .del{background:var(--card2)}
.ring{width:66px;height:66px}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--card2)} .ring .fg{stroke:var(--me);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--display);font-size:24px;fill:var(--ink)}

/* results */
.results{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.res-medal{display:grid;justify-items:center;gap:6px;text-align:center}
.res-medal svg{width:170px;height:170px}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.score{font-family:var(--display);font-size:clamp(56px,10vw,100px);line-height:1}
.res-body{display:grid;gap:12px;min-width:0}
.callout{border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;background:color-mix(in srgb,var(--sun) 35%,var(--card))}
.callout.mint{background:color-mix(in srgb,var(--mint) 35%,var(--card))}
.mistakes{display:flex;gap:8px;flex-wrap:wrap}
.mistakes span{border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:900;background:var(--card)}
.mistakes small{color:var(--bad);font-weight:800}

/* progress / reports */
.report{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.two > *{min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-weight:800;font-size:12px;fill:var(--muted)}
.chart .lbl{fill:var(--ink)}
.empty-chart{border:2px dashed var(--grid);border-radius:14px;padding:30px 16px;text-align:center;color:var(--muted);font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:320px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--card2);border:2px solid transparent;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900;color:var(--muted)}
.cal i.a{background:var(--me);color:var(--on-accent)}
.cal i.l{border-color:var(--me)}
.cal i.t{outline:2px solid var(--line)}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:320px;font-size:11px;font-weight:900;color:var(--muted);text-align:center;margin-bottom:4px}
.hist{overflow-x:auto}
.hist table{width:100%;border-collapse:collapse;min-width:560px}
.hist th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:2.5px solid var(--line)}
.hist td{padding:8px 10px;border-bottom:1.5px solid var(--grid);font-weight:700;vertical-align:middle}
.hist td svg{width:26px;height:26px;vertical-align:middle}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:900;border:1.5px solid var(--line)}
.pill.test{background:color-mix(in srgb,var(--sun) 50%,var(--card))}
.pill.practice{background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.pill.clock{background:color-mix(in srgb,var(--tomato) 45%,var(--card))}
.pill.daily{background:color-mix(in srgb,var(--grape) 45%,var(--card))}
.trophy-line{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:2px dashed var(--grid)}
.trophy-line > span:not(.muted){display:inline-flex;align-items:center;gap:4px}
.trophy-line b{font-family:var(--display);font-weight:400;font-size:20px}
.trophy-line .locked svg{opacity:.28;filter:grayscale(1)}
.unlock{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
/* reward games */
.game-host{position:relative}
.gq{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;width:min(560px,calc(100vw - 32px));background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:16px;display:grid;gap:12px;text-align:center}
.gq-text{font-family:var(--display);font-size:44px;line-height:1}
.gq-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gq-opts .btn{font-size:28px;padding:14px 0}
.gq-time{height:10px;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.gq-time span{display:block;height:100%;width:100%;background:var(--me)}
.jg{display:grid;gap:12px;max-width:min(620px,calc((100vh - 400px) * 7 / 9));min-width:280px;margin:0 auto;padding-bottom:210px}
.jg-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:18px}
.jg-msg{flex:1;text-align:center;font-weight:800;font-size:15px}
.jg-lives{letter-spacing:2px;font-size:15px}
.jg-board{display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));gap:4px;background:#2F5D2A;padding:6px;border:3px solid var(--line);border-radius:16px}
.jg-c{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(14px,min(3.4vh,4.6vw),30px);line-height:1;overflow:hidden;border-radius:8px;border:0;background:#3E7A34;position:relative;padding:0}
.jg-c.path{background:#B98A55}.jg-c.rock{background:#55704E}.jg-c.gold{background:#E8B923}.jg-c.river{background:#3B8FD0}
.jg-c.can{outline:4px solid #FFE36E;outline-offset:-4px;cursor:pointer;animation:jg-pulse 1s infinite alternate}
.jg-c.aim{outline:4px solid #FFFFFF;outline-offset:-4px}
@keyframes jg-pulse{to{filter:brightness(1.2)}}
.jg-me{position:relative;display:grid;place-items:center;width:84%;height:84%}
.jg-me img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #FFE36E}
.jg-me i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:60%}
@keyframes jg-claw{0%{opacity:0;transform:translate(-40%,-40%) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(10%,10%) scale(1.1)}}
.jg-me{position:relative}.jg-me.clawed::after{content:'';position:absolute;inset:-20%;pointer-events:none;animation:jg-claw .7s ease-out forwards;background:linear-gradient(135deg,transparent 30%,#fff 31%,#fff 34%,transparent 35%,transparent 45%,#fff 46%,#fff 49%,transparent 50%,transparent 60%,#fff 61%,#fff 64%,transparent 65%);filter:drop-shadow(0 0 3px #f33)}
.jg-board{position:relative}.jg-board.tiles .jg-c .emo.jg-ogre{visibility:visible;font-size:150%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.jg-fly{position:absolute;z-index:5;font-size:34px;line-height:1;pointer-events:none;margin:-17px 0 0 -17px;transform:none;transition:transform .42s cubic-bezier(.3,.6,.4,1);rotate:var(--ang)}
.jg-fly.axe{animation:jg-spin .15s linear infinite}@keyframes jg-spin{to{rotate:360deg}}
@keyframes jg-swipe{0%{transform:none}35%{transform:translate(var(--dx),var(--dy)) scale(1.35) rotate(-14deg)}55%{transform:translate(calc(var(--dx) * .8),calc(var(--dy) * .8)) scale(1.3) rotate(12deg)}100%{transform:none}}
.jg-c.swiping{z-index:4;overflow:visible;animation:jg-swipe .6s ease-out}
@keyframes jg-slither{0%{transform:translateX(-30%) rotate(-12deg) scale(.8);opacity:.4}60%{transform:translateX(8%) rotate(6deg)}100%{transform:none;opacity:1}}
@keyframes jg-wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.jg-snake,.jg-anaconda{display:inline-block;animation:jg-wiggle 1.2s ease-in-out infinite}.jg-snake.moved,.jg-anaconda.moved{animation:jg-slither .45s ease-out,jg-wiggle 1.2s ease-in-out .45s infinite}
@keyframes jg-danger{from{box-shadow:0 0 0 0 rgba(255,80,60,.0)}to{box-shadow:0 0 0 8px rgba(255,80,60,.75)}}
.jg-board[data-near="3"]{box-shadow:0 0 0 5px rgba(255,190,60,.6)}.jg-board[data-near="2"]{animation:jg-danger .8s ease-in-out infinite alternate}.jg-board[data-near="1"]{animation:jg-danger .35s ease-in-out infinite alternate}
.jg-anaconda{filter:hue-rotate(60deg) saturate(1.6) brightness(.8);font-size:120%}
.jg-over{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.jg-over .sticker{max-width:460px;text-align:center;display:grid;gap:10px;justify-items:center}
.jg-big{font-size:64px;line-height:1}
.stg-pick{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
.stg-preview{display:grid;justify-items:center;gap:8px;position:sticky;top:12px}
.stg-preview .perf{width:100%;max-width:260px;height:auto}
.stg-opts{display:grid;gap:16px}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.song{border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:900;background:var(--card);text-align:left}
.song.on{background:var(--era);color:var(--era-t);box-shadow:3px 3px 0 var(--shadow)}
.addsong{margin-top:14px;display:grid;gap:6px}.addsong label{font-weight:900;font-size:14px}.addsong input{flex:1 1 160px;min-width:0}.addsong select{flex:0 1 150px}
.stg{position:relative;height:min(78vh,720px);border:3px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(#0B0F2A,#1D1450 60%,#2A1A55)}
.stg-sky{position:absolute;inset:0}
.beam{position:absolute;top:-10%;width:90px;height:110%;background:linear-gradient(var(--c),transparent 80%);opacity:.35;transform-origin:top center;animation:beam 3.2s ease-in-out infinite alternate;animation-delay:var(--d);filter:blur(2px);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
@keyframes beam{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.stg-crowd{position:absolute;left:0;right:0;bottom:0;height:30%;display:grid;grid-template-columns:repeat(45,1fr);gap:3px;padding:8px;align-content:end}
.stg-crowd i{aspect-ratio:1;border-radius:50%;background:#2A2550;transition:background .4s,box-shadow .4s}
.stg-crowd i.on{background:hsl(var(--h) 90% 65%);box-shadow:0 0 8px hsl(var(--h) 90% 65%)}
.stg.roar .stg-crowd i.on{animation:roar .35s 2}
@keyframes roar{50%{transform:translateY(-6px)}}
.stg-floor{position:absolute;left:0;right:0;bottom:31%;display:grid;place-items:center;border-bottom:10px solid #0B0B18;box-shadow:0 10px 30px rgba(255,255,255,.12)}
.stg-perf{position:relative;width:min(260px,34vh);animation:bob .9s ease-in-out infinite alternate}
.stg-perf .perf{width:100%;height:auto;filter:drop-shadow(0 0 18px rgba(255,255,255,.35))}
@keyframes bob{to{transform:translateY(-6px) rotate(1deg)}}
.note{position:absolute;right:-6px;top:10%;font-size:34px;color:#FFE36E;animation:note 1.6s linear infinite}
.note.n2{right:auto;left:-6px;animation-delay:.8s}
@keyframes note{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.stg-hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:#FFF;font-size:18px}
.stg-hud .meter{flex:1 1 160px;height:14px;border:2px solid #FFF;border-radius:99px;overflow:hidden}
.stg-hud .meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#F5A3C7,#E8B923);transition:width .5s}
@media (max-width:760px){ .stg-pick{grid-template-columns:1fr} .stg-preview{position:static} }
/* held sideways: the question sits beside the board instead of over it */
@media (min-aspect-ratio:5/4){
  .gq{left:auto;right:16px;bottom:auto;top:50%;transform:translateY(-50%);width:min(380px,32vw)}
  .gq-opts{grid-template-columns:1fr}
  .jg{max-width:none;display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);grid-template-rows:auto auto;gap:10px 16px;align-items:center;padding-bottom:24px}
  .jg-bar{grid-column:2;grid-row:1}
  .jg-board{grid-column:2;grid-row:2;width:min(620px,calc((100vh - 190px) * 7 / 9))}
  .jg .jg-act{grid-column:1;grid-row:1/3;display:grid;justify-items:center;justify-self:end;width:min(360px,100%)}   /* outranks the base display:none below */
  .jg-act{position:relative}.jg-act video{position:absolute;top:0;left:0;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;border:3px solid var(--line);background:#2F5D2A;opacity:0;transition:opacity .6s;pointer-events:none}
  .jg-act.has-clip video{opacity:1}.jg-act:not(.has-clip) img{animation:jg-kb 6s ease-out both}
  @keyframes jg-kb{from{transform:scale(1)}to{transform:scale(1.06)}}
  .jg-act img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:16px;border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);background:#2F5D2A}
  .jg-act b{position:relative;z-index:2;margin-top:-24px;background:#FFE36E;color:#1B2140;border:3px solid var(--line);border-radius:999px;padding:4px 18px;font-family:var(--display);font-size:24px;font-weight:400}
  .jg .gq{grid-column:3;grid-row:1/3;position:static;transform:none;width:min(380px,100%);justify-self:start}
  .jg .jg-over{position:fixed}
}
.dress-ph{width:44px;height:66px;object-fit:cover;border-radius:8px;border:2px solid var(--line);background:var(--card2)}
.dress-ph.big{width:72px;height:108px;flex:none}
.dress-ph.locked{filter:grayscale(1) blur(1.5px);opacity:.45}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:10px}
.look{display:grid;gap:4px;justify-items:center;background:none;border:3px solid transparent;border-radius:14px;padding:4px}
.look img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid var(--line);background:#1D1450}
.look span{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--era);color:var(--era-t);border:1.5px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look.on{border-color:var(--line);background:var(--card2)}
.stg-big{width:100%;max-width:320px;aspect-ratio:2/3;object-fit:cover;border-radius:16px;border:3px solid var(--line);background:#1D1450}
.stg-photos{position:absolute;inset:0;display:grid;place-items:center;background:#0B0F2A}
.stg-photos .stg-fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.55);transform:scale(1.15);opacity:1;animation:none}
.stg-photos img.pose{position:absolute;height:100%;width:auto;max-width:none;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .45s ease;animation:stg-beat var(--beat,.5s) ease-in-out infinite alternate}
.stg-photos img.pose.on{opacity:1}
.stg-photos .stg-clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;pointer-events:none}.stg-photos .stg-clip.on{opacity:1}
@keyframes stg-beat{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.025) rotate(.4deg)}}
.stg.roar .stg-photos img.pose.on{filter:brightness(1.25) saturate(1.2)}
.stg-pop{position:absolute;left:50%;top:auto;bottom:12%;transform:translate(-50%,0);font-family:var(--display);font-size:40px;color:#FFE36E;text-shadow:0 3px 12px rgba(0,0,0,.6);opacity:0;pointer-events:none}
.stg-pop.go{animation:stg-pop 1.4s ease-out}
@keyframes stg-pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.jg-bd{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;filter:blur(10px) brightness(.6);transform:scale(1.06)}
.jg-bar{color:#FFFFFF;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.jg-act{display:none}
body:has(#game-host) .top{position:relative;z-index:35}   /* above a game's full-screen cards, so Finish for now always works */
.lightbox{z-index:40;cursor:zoom-out}
.lightbox img{max-width:min(92vw,720px);max-height:88vh;border-radius:16px;border:3px solid var(--line);background:#1D1450}
.jg-board.tiles .jg-c{background-size:cover;background-position:center}
.jg-board.tiles .jg-c .emo{visibility:hidden}
.jg-board.tiles .jg-c.jungle{background-image:var(--t-jungle1)}
.jg-board.tiles .jg-c.jungle.alt{background-image:var(--t-jungle2)}
.jg-board.tiles .jg-c.path{background-image:var(--t-path)}
.jg-board.tiles .jg-c.rock{background-image:var(--t-rock)}
.jg-board.tiles .jg-c.gold{background-image:var(--t-gold)}
.jg-board.tiles .jg-c.river{background-image:var(--t-river)}
.jg-board.tiles .jg-c.river.boat{background-image:var(--t-boat)}
.jg-board.tiles .jg-c.has-snake{background-image:var(--t-snake)}
.jg-board.tiles .jg-c.has-panther{background-image:var(--t-panther)}
.jg-board.tiles .jg-c.has-anaconda{background-image:var(--t-anaconda)}
body:has(.jg-bd) .top .brand, body:has(.jg-bd) .top .sync{color:#FFFFFF;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.jg-scene{display:grid;gap:10px;justify-items:center;text-align:center;max-width:420px}
.jg-photo{width:100%;max-height:52vh;aspect-ratio:2/3;object-fit:cover;border-radius:14px;border:3px solid var(--line);background:#2F5D2A}
.pill.approved{background:color-mix(in srgb,var(--mint) 45%,var(--card))}
.pill.rejected{background:var(--card);color:var(--muted)}
.prizelog{display:flex;gap:6px;flex-wrap:wrap}
.prizelog svg{width:34px;height:34px}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;align-items:start}
.board{display:grid;grid-template-columns:repeat(13,minmax(24px,1fr));gap:3px;min-width:320px}
.board > *{aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:900;border-radius:7px;border:0;padding:0;font-variant-numeric:tabular-nums}
.board .h{font-family:var(--display);font-weight:400;font-size:14px;color:var(--muted);background:none}
.board button{background:var(--card);border:1.5px solid var(--grid)}
.board button.hl{background:var(--sun);color:var(--on-accent);border-color:var(--line)}
.board button.sel{background:var(--me);color:var(--on-accent);border:2.5px solid var(--line);transform:scale(1.18);z-index:1;position:relative}
.board button.ax{background:color-mix(in srgb,var(--me) 22%,var(--card))}
.fact-big{font-family:var(--display);font-size:clamp(44px,8vw,72px);line-height:1}
.dots{width:100%;max-width:360px;height:auto;color:var(--me);display:block;margin:14px 0}
.dots circle{stroke:var(--line);stroke-width:1.2}

/* parent */
.parent-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:28px}
.ov-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.ov-grid div{display:grid}
.ov-grid b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.ov-grid span{font-size:12px;font-weight:800;color:var(--muted)}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.sec{margin:36px 0 16px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{margin:0}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:2.5px solid var(--line);cursor:pointer}
.swatches input:checked + span{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--line)}
.swatches input:focus-visible + span{outline:3px solid var(--sky);outline-offset:6px}
.logins{list-style:none;padding:0;margin:0;display:grid;gap:2px;max-height:300px;overflow:auto;font-weight:700;font-size:14px}
.logins li{padding:5px 0;border-bottom:1.5px solid var(--grid);font-variant-numeric:tabular-nums}
.narrow{max-width:520px;padding-top:20px;margin:0 auto}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;gap:12px}
.loading .mega{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:800;z-index:60;max-width:calc(100% - 32px)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- player themes ---------- */
:root[data-skin="eras"]{
  --paper:#FFF2F8; --grid:#F6D9EA; --ink:#3A1F4D; --muted:#7A5E8C; --line:#3A1F4D;
  --card:#FFFFFF; --card2:#F8E8F4; --shadow:#3A1F4D; --on-accent:#3A1F4D;

.journey svg{width:100%;height:auto;display:block}
.journey text{font-family:var(--display)}
.journey .cap{font-family:var(--body);font-weight:800;font-size:15px;fill:var(--muted)}

.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.hanger,.slot-btn{display:grid;justify-items:center;gap:4px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px}
.hanger.on,.slot-btn.on{border-color:var(--line);background:var(--card2)}
.hanger span{font-size:11px;font-weight:900;line-height:1.1;padding:2px 6px;border-radius:999px;background:var(--era);color:var(--era-t);border:1.5px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hanger.locked span{background:var(--card2);color:var(--muted)}
.kit{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px}
.slot-btn{background:var(--card2);border-color:var(--grid)}
.slot-btn span{font-size:11px;font-weight:900;line-height:1.15;text-align:center}
.slot-btn.locked span{color:var(--muted)}
.item-detail{display:flex;gap:14px;align-items:center;margin:14px 0 4px;padding:12px;border:2px dashed var(--line);border-radius:14px}
.item-detail > div{min-width:0}
.item-detail svg{flex:none}
.item-new,.ball{display:flex;gap:14px;align-items:center}
.ball{margin-top:12px}
.ball svg{flex:none}
@media (max-width:560px){ .rail,.kit{grid-template-columns:repeat(4,1fr)} }
@media (max-width:880px){
  .grid-home,.two,.explore{grid-template-columns:1fr}
  .play{grid-template-columns:1fr}
  .pad{max-width:420px;width:100%;margin:0 auto}
}
@media (max-width:560px){
  .results{grid-template-columns:1fr;justify-items:center;text-align:center}
  .res-body{justify-items:center}
  .shelf-row{grid-template-columns:repeat(2,1fr);row-gap:16px}
  .pad button{height:64px}
  .qcard{padding:32px 10px 22px}
  .brand span{font-size:19px}
}
@media (max-width:400px){ .modes{grid-template-columns:1fr} }
@media (max-width:520px){ .todo li{grid-template-columns:42px minmax(0,1fr)} .todo li .btn{grid-column:2;justify-self:start}
  .board button{min-height:32px} .card-h .link,.foot-link .link{display:inline-block;padding:10px 4px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
